<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Pricing component</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link href = "style.css" rel="stylesheet">
  </head>
  <body>
  <div class="container">
    <input type="checkbox" id="pricing-toggle">
    <div class="main">
      <div class="heading">Our Pricing
        <div class="pricing">
          <span>Annually</span>
          <label class="toggle" for="pricing-toggle">
            <span class="circle"></span>
          </label>
          <span>Monthly</span>
        </div>
      </div>
    </div>

    <div class="annualprice">
      <div class="type">
        <div class="basic">Basic

          <div class="price">
            <span class="annual">$199.99</span>
            <span class="monthly">$19.99</span>
            <div class="horizontal-line"></div>
            <div class="storage">500 GB Storage
              <div class="horizontal-line"></div>
              <div class="allowed">2 Users allowed
                <div class="horizontal-line"></div>
                <div class="send">Send up to 3 GB
                  <div class="horizontal-line"></div>
                  <div class="button"><button>Learn More</button>

                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>



      <div class="type professional-card">

        <div class="professional">Professional
          <div class="price">
            <span class="annual">$249.99</span>
            <span class="monthly">$24.99</span>
            <div class="horizontal-line"></div>
            <div class="storage">1 TB Storage
              <div class="horizontal-line"></div>
              <div class="allowed">5 Users allowed
                <div class="horizontal-line"></div>
                <div class="send">Send up to 10 GB
                  <div class="horizontal-line"></div>
                  <div class="button"><button>Learn More</button>

                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>




      <div class="type">
        <div class="master">Master
          <div class="price">
            <span class="annual">$399.99</span>
            <span class="monthly">$39.99</span>
            <div class="horizontal-line"></div>
            <div class="storage">2 TB Storage
              <div class="horizontal-line"></div>
              <div class="allowed">10 Users allowed
                <div class="horizontal-line"></div>
                <div class="send">Send up to 20 GB
                  <div class="horizontal-line"></div>
                  <div class="button"><button>Learn More</button>

                  </div>
                </div>

              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
</body>

</html>
